<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Семейный бюджет</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F2EB">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Боковая навигация и сетка карточек на компьютере; нижняя панель и кнопка «+» на телефоне */
:root{
  --bg:#F6F2EB; --surface:#FFFDF9; --sunk:#EEE9E0; --line:#E3DCD0;
  --fg:#2B2722; --muted:#7D756A; --accent:#2F5D50; --accent-ink:#FFFDF9; --accent-soft:#E2ECE7;
  --laura:#B9584D; --laura-soft:#F6E3DF; --mama:#8A6A3F; --mama-soft:#F1E7D7;
  --good:#3E7B5B; --bad:#B9584D; --warn-soft:#FBF0D9; --warn:#8A5A12;
  --shadow:0 1px 2px rgba(60,45,25,.06),0 6px 20px rgba(60,45,25,.05);
  --display:"Unbounded","Onest",system-ui,sans-serif; --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1B1915; --surface:#24211C; --sunk:#2D2A24; --line:#3A362F;
  --fg:#F1ECE3; --muted:#A39B8E; --accent:#7FB8A4; --accent-ink:#13201B; --accent-soft:#24372F;
  --laura:#E08A7E; --laura-soft:#3B2724; --mama:#D2AE78; --mama-soft:#38301F; --good:#7FC29C; --bad:#E08A7E;
  --warn-soft:#3A3020; --warn:#E3B66A; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1915; --surface:#24211C; --sunk:#2D2A24; --line:#3A362F;
  --fg:#F1ECE3; --muted:#A39B8E; --accent:#7FB8A4; --accent-ink:#13201B; --accent-soft:#24372F;
  --laura:#E08A7E; --laura-soft:#3B2724; --mama:#D2AE78; --mama-soft:#38301F; --good:#7FC29C; --bad:#E08A7E;
  --warn-soft:#3A3020; --warn:#E3B66A; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
a{color:var(--accent)}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:28px 18px;display:flex;flex-direction:column;gap:28px;border-right:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:-.01em;padding-left:10px}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:10px 12px;border-radius:12px;color:var(--muted);text-align:left;font-weight:500}
.nav svg{width:19px;height:19px;flex:none}
.nav button:hover{background:var(--sunk);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;font-size:13px;color:var(--muted)}
.ava{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px}
.ava.L{background:var(--laura-soft);color:var(--laura)} .ava.M{background:var(--mama-soft);color:var(--mama)}

main{min-width:0;padding:28px max(28px,env(safe-area-inset-right)) 60px max(28px,env(safe-area-inset-left))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-family:var(--display);font-weight:600;font-size:26px;letter-spacing:-.02em;margin:0}
.spacer{flex:1}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.month button{border:0;background:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.month button:hover{background:var(--sunk);color:var(--fg)}
.month span{min-width:124px;text-align:center;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--accent);color:var(--accent-ink);padding:10px 18px;border-radius:999px;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.small{padding:7px 13px;font-size:14px}
.link{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:12px;padding:10px 14px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;flex-wrap:wrap}

.card{background:var(--surface);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:16px;margin:0 0 14px;font-weight:600;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card h2 span{font-size:13px;color:var(--muted);font-weight:400}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.balance{display:flex;flex-direction:column;gap:12px;background:var(--accent);color:var(--accent-ink)}
.balance .label{color:inherit;opacity:.75}
.balance .big{font-family:var(--display);font-size:clamp(30px,4.4vw,44px);font-weight:600;letter-spacing:-.02em;line-height:1}
.balance .dir{font-size:17px;font-weight:500}
.balance .formula{font-size:13px;opacity:.85;border-top:1px solid color-mix(in srgb,var(--accent-ink) 25%,transparent);padding-top:12px}
.balance .btn{background:var(--accent-ink);color:var(--accent);align-self:flex-start}
.bigsum{font-family:var(--display);font-size:32px;font-weight:600;letter-spacing:-.02em;margin-top:8px}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:18px;background:var(--sunk)}
.split i{display:block}
.legend{display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend b{color:var(--fg);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi .v{font-size:22px;font-weight:600;margin-top:6px}
.kpi .sub{font-size:13px;color:var(--muted);margin-top:2px}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;margin-bottom:8px}
.tL{background:var(--laura-soft);color:var(--laura)} .tM{background:var(--mama-soft);color:var(--mama)} .tN{background:var(--sunk);color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}

.cats{display:flex;flex-direction:column;gap:12px}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.cat .chip{justify-self:start}
.cat .bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.cat .bar i{display:block;height:100%;border-radius:99px}
.meta{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:3px 10px 3px 8px;border-radius:99px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

.ops{display:flex;flex-direction:column}
.op{display:block;padding:11px 0;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left}
.opg{display:grid;grid-template-columns:46px minmax(0,1fr) max-content;gap:12px;align-items:center}
.op:first-child{border-top:0}
.op:hover .t{color:var(--accent)}
.op .d{font-size:12px;color:var(--muted);text-align:center;line-height:1.15}
.op .d b{display:block;font-size:17px;color:var(--fg);font-weight:600}
.op .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .s{display:flex;gap:8px;align-items:center;margin-top:3px;flex-wrap:wrap}
.op .r{text-align:right;white-space:nowrap}
.op .r .a{font-weight:600}
.op .r .opx{font-size:12px;color:var(--muted)}
.op.neg .a{color:var(--good)}
.empty{color:var(--muted);font-size:14px;padding:12px 0}
.diff{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 14px;align-items:center;font-size:14px}
.up{color:var(--bad)} .down{color:var(--good)}

.filters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.filters .q{grid-column:span 2}
.inp,select.inp{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
textarea.inp{resize:vertical;min-height:64px}
.sum{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.sum b{color:var(--fg)}

.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr:last-child td{border-bottom:0}

.catcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.catcard{display:flex;flex-direction:column;gap:8px;text-align:left;border:0;background:var(--surface);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.catcard:hover{box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.catcard .rule{font-size:14px}
.list{display:flex;flex-direction:column}
.list .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list .row:first-child{border-top:0}
.hist{display:flex;flex-direction:column;gap:2px;font-size:14px}
.hist .h{padding:9px 0;border-top:1px solid var(--line)}
.hist .h:first-child{border-top:0}
.hist .when{font-size:12px;color:var(--muted)}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .gl{stroke:var(--line)}

/* Лист (форма) */
.scrim{position:fixed;inset:0;background:rgba(30,24,16,.36);z-index:40;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(540px,100%);height:100%;overflow:auto;padding:22px max(22px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) 22px;display:flex;flex-direction:column;gap:16px;animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet h3{font-family:var(--display);font-weight:600;font-size:19px;margin:0}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;flex:none}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lab{font-size:13px;color:var(--muted);font-weight:500}
.amount{font-size:26px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;padding:9px 8px;border-radius:9px;font-weight:500;color:var(--muted);min-width:44px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.picker{display:flex;flex-wrap:wrap;gap:6px}
.picker button{border:1px solid var(--line);background:var(--surface)}
.picker button[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.hint{font-size:12px;color:var(--muted)}
.box{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.box table{width:100%;border-collapse:collapse;font-size:14px}
.box td{padding:5px 0;border-bottom:1px dashed var(--line);vertical-align:top}
.box td:last-child{text-align:right;white-space:nowrap;padding-left:10px}
.box tr:last-child td{border-bottom:0}
.res{border-radius:12px;padding:12px 14px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.err{color:var(--bad);font-size:14px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 110px 132px;gap:8px;align-items:center}
.prow label{display:flex;gap:8px;align-items:center;min-width:0}
.prow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.prow .inp{padding:8px 10px}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.save{border:0;background:var(--accent);color:var(--accent-ink);padding:14px;border-radius:14px;font-weight:600;font-size:16px}
.save:disabled{opacity:.5;cursor:default}

.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);text-align:center;padding:20px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;font-size:14px;z-index:60;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
.toast button{border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline;padding:2px 4px}
@media (min-width:761px){.toast{bottom:28px}}

.tabbar,.fab{display:none}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters .q{grid-column:span 2}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:16px max(16px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .hero{grid-template-columns:1fr}
  .top h1{font-size:21px}
  .top .btn.add{display:none}
  .kpis{gap:10px}.card{padding:16px;border-radius:18px}
  .kpi .v{font-size:18px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));z-index:30;justify-content:space-around}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 2px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabbar svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--accent)}
  .fab{display:grid;place-items:center;position:fixed;right:calc(18px + env(safe-area-inset-right));bottom:calc(76px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(47,93,80,.35);z-index:31}
  .row2{grid-template-columns:1fr}
  .prow{grid-template-columns:minmax(0,1fr) 96px;}
  .prow select{grid-column:1/-1}
  .month span{min-width:104px}
}
.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;overflow:auto;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.login-card{width:min(380px,100%);display:flex;flex-direction:column;gap:16px;text-align:left}
.login-card img{border-radius:20px;box-shadow:var(--shadow);align-self:center}
.login-card h1{font-family:var(--display);font-weight:600;font-size:22px;margin:0;text-align:center}
.login-card .hint{text-align:center;margin:0}
main{padding-top:max(28px,calc(env(safe-area-inset-top) + 12px))}
@media (max-width:760px){main{padding-top:max(16px,calc(env(safe-area-inset-top) + 8px))}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">Семейный бюджет<small>Лаура и мама</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="who" id="who"></div>
  </aside>
  <main><div class="wrap" id="view"><div class="loading">Загружаем данные…</div></div></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<button class="fab" id="fab" data-act="add-expense" aria-label="Добавить расход" hidden><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<div id="login" class="login" hidden></div>

<script>
/* Финансовое ядро: тот же код, что выполняется на сервере */
function allocate_(amount, weights) {
  var total = 0, i;
  for (i = 0; i < weights.length; i++) total += weights[i];
  if (!(total > 0)) throw new Error('Сумма долей должна быть больше нуля');
  var sign = amount < 0 ? -1 : 1, abs = Math.abs(amount), base = [], sum = 0, order = [];
  for (i = 0; i < weights.length; i++) {
    base[i] = Math.floor(abs * weights[i] / total);
    sum += base[i];
    order.push({ i: i, r: (abs * weights[i]) % total });
  }
  order.sort(function (a, b) { return b.r - a.r || a.i - b.i; });
  for (i = 0; i < abs - sum; i++) base[order[i].i] += 1;
  return base.map(function (v) { return v * sign; });
}
function computeSplit_(amount, paidBy, mode, parts) {
  if (typeof amount !== 'number' || Math.floor(amount) !== amount || amount === 0) throw new Error('Укажите сумму');
  if (Math.abs(amount) > 100000000000) throw new Error('Слишком большая сумма');
  if (paidBy !== 'L' && paidBy !== 'M') throw new Error('Укажите, кто оплатил');
  if (!parts || !parts.length) throw new Error('Выберите хотя бы одного участника');
  var seen = {};
  parts.forEach(function (p) {
    if (seen[p.m]) throw new Error('Участник указан дважды');
    seen[p.m] = 1;
  });
  var rank = function (p) { return p.m === 'L' ? 2 : p.m === 'M' ? 0 : 1; };
  var ps = parts.slice().sort(function (a, b) { return rank(a) - rank(b); });
  var amounts;
  if (mode === 'equal') {
    amounts = allocate_(amount, ps.map(function () { return 1; }));
  } else if (mode === 'percent') {
    var bp = 0;
    ps.forEach(function (p) {
      if (!(p.bp > 0)) throw new Error('У каждого участника процент должен быть больше нуля');
      bp += p.bp;
    });
    if (bp !== 10000) throw new Error('Сумма процентов должна быть 100%, сейчас ' + (bp / 100).toString().replace('.', ',') + '%');
    amounts = allocate_(amount, ps.map(function (p) { return p.bp; }));
  } else if (mode === 'fixed') {
    var s = 0;
    amounts = ps.map(function (p) {
      if (typeof p.kop !== 'number' || Math.floor(p.kop) !== p.kop) throw new Error('Укажите сумму для каждого участника');
      s += p.kop;
      return p.kop;
    });
    if (s !== amount) throw new Error('Сумма долей (' + (s / 100).toFixed(2).replace('.', ',') + ' ₽) не равна сумме расхода (' + (amount / 100).toFixed(2).replace('.', ',') + ' ₽)');
  } else {
    throw new Error('Неизвестный способ распределения');
  }
  var respL = 0;
  var shares = ps.map(function (p, i) {
    var resp = p.resp || (p.m === 'L' ? 'L' : 'M');
    if (resp !== 'L' && resp !== 'M') throw new Error('Отвечать за долю может только Лаура или мама');
    if (resp === 'L') respL += amounts[i];
    var sh = { m: p.m, kop: amounts[i], resp: resp };
    if (mode === 'percent') sh.bp = p.bp;
    return sh;
  });
  var respM = amount - respL;
  return {
    shares: shares, respL: respL, respM: respM,
    // Положительное значение — Лаура должна маме, отрицательное — мама должна Лауре.
    delta: paidBy === 'M' ? respL : -respM
  };
}
function settle_(expenses, transfers) {
  var r = { total: 0, count: expenses.length, paidL: 0, paidM: 0, respL: 0, respM: 0, lOwesM: 0, mOwesL: 0, tLM: 0, tML: 0 };
  expenses.forEach(function (e) {
    r.total += e.amount;
    if (e.paidBy === 'L') { r.paidL += e.amount; r.mOwesL += e.respM; } else { r.paidM += e.amount; r.lOwesM += e.respL; }
    r.respL += e.respL;
    r.respM += e.respM;
  });
  transfers.forEach(function (t) { if (t.from === 'L') r.tLM += t.amount; else r.tML += t.amount; });
  r.net = r.lOwesM - r.mOwesL; // до переводов; > 0 — Лаура должна маме
  r.balance = r.net - r.tLM + r.tML; // остаток после переводов
  // Сколько переводов пошло на погашение долга в нужную сторону.
  r.compensated = r.net >= 0 ? r.tLM : r.tML;
  return r;
}
function roundRub_(kop) {
  var s = kop < 0 ? -1 : 1;
  return s * Math.floor((Math.abs(kop) + 50) / 100) * 100;
}

<script>
'use strict';

async function call(fn, args, token) {
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL) && !/^http:\/\/localhost/.test(API_URL)) {
    throw new Error('В файле config.js не указана ссылка на Google Apps Script (она заканчивается на /exec).');
  }

  try { r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn, args, token }), headers: { 'Content-Type': 'text/plain;charset=utf-8' } }); }

/* ================= Справочники и форматирование ================= */
const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

const grp = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

function niceMax(v) { if (v <= 0) return 100; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
function vbars(labels, series, stacked) {
  const vw = (document.getElementById('view') || {}).clientWidth || 640;
  const W = Math.max(300, Math.min(1100, vw - 44)), H = W < 500 ? 200 : 260, pl = 52, pr = 8, pt = 12, pb = 26, n = labels.length;
  const tot = labels.map((_, i) => stacked ? series.reduce((a, s) => a + Math.max(0, s.values[i]), 0) : Math.max(0, ...series.map(s => s.values[i])));
  const max = niceMax(Math.max(...tot, 0)), ih = H - pt - pb, cw = (W - pl - pr) / n;
  const y = v => pt + ih - v / max * ih;
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = max * i / 4, yy = y(v); g += `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}"/><text x="${pl - 6}" y="${yy + 4}" text-anchor="end">${shortRub(v)}</text>`; }
  labels.forEach((l, i) => {
    const x0 = pl + i * cw;
    if (stacked) {
      let base = 0; const bw = cw * .56;
      series.forEach(s => { const v = Math.max(0, s.values[i]); if (v > 0) { g += `<rect x="${x0 + (cw - bw) / 2}" y="${y(base + v)}" width="${bw}" height="${y(base) - y(base + v)}" fill="${s.color}" rx="2"><title>${l}: ${s.name} ${rub(v)}</title></rect>`; } base += v; });
    } else {
      const bw = cw * .72 / series.length;
      series.forEach((s, j) => { const v = Math.max(0, s.values[i]); if (v > 0) g += `<rect x="${x0 + cw * .14 + j * bw}" y="${y(v)}" width="${bw - 2}" height="${y(0) - y(v)}" fill="${s.color}" rx="2"><title>${l}: ${s.name} ${rub(v)}</title></rect>`; });
    }
    g += `<text x="${x0 + cw / 2}" y="${H - 8}" text-anchor="middle">${l}</text>`;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg></div>
    <div class="legend">${series.map(s => `<span><span class="dot" style="background:${s.color}"></span>${s.name}</span>`).join('')}</div>`;
}

/* ================= Категории ================= */
function ruleText(c) {
  if (c.mode === 'personal') return 'Личная: целиком на того, чья покупка';
  const parts = JSON.parse(c.partsJson || '[]');
  const names = parts.map(p => member(p.m).name);
  let t;
  if (c.mode === 'equal') t = (c.flexible ? 'Гибкая, по умолчанию поровну на ' : 'Поровну на ') + parts.length + ': ' + names.join(', ');
  else if (c.mode === 'percent') t = parts.map(p => member(p.m).name + ' ' + String(p.bp / 100).replace('.', ',') + '%').join(' · ');
  else t = parts.map(p => member(p.m).name + ' ' + rub(p.kop)).join(' · ') + ' (фиксированно)';
  const odd = parts.filter(p => p.resp !== (p.m === 'L' ? 'L' : 'M'));
  if (odd.length) t += '. Особые правила: ' + odd.map(p => 'долю «' + member(p.m).name + '» платит ' + (p.resp === 'L' ? 'Лаура' : 'мама')).join(', ');
  return t;
}

function histLine(h) {
  const who = userName(h.user), b = h.before ? JSON.parse(h.before) : null, a = h.after ? JSON.parse(h.after) : null, o = a || b || {};
  const verb = { create: 'добавила', update: 'изменила', delete: 'удалила', restore: 'вернула', archive: 'отправила в архив' }[h.action] || h.action;
  let what = '';
  if (h.entity === 'expense') {
    what = `расход «${esc(o.title)}» на ${rub(o.amount)} (${dmy(o.date)})`;
    if (h.action === 'update' && b && a) {
      const ch = [];
      if (b.amount !== a.amount) ch.push('сумма ' + rub(b.amount) + ' → ' + rub(a.amount));
      if (b.title !== a.title) ch.push('назначение «' + esc(b.title) + '» → «' + esc(a.title) + '»');
      if (b.date !== a.date) ch.push('дата ' + dmy(b.date) + ' → ' + dmy(a.date));
      if (b.categoryName !== a.categoryName) ch.push('категория ' + esc(b.categoryName) + ' → ' + esc(a.categoryName));
      if (b.paidBy !== a.paidBy) ch.push('платила ' + payerName(b.paidBy).toLowerCase() + ' → ' + payerName(a.paidBy).toLowerCase());
      if (b.sharesJson !== a.sharesJson) ch.push('распределение');
      if (b.comment !== a.comment) ch.push('комментарий');
      if (ch.length) what += ': ' + ch.join(', ');
    }
  } else if (h.entity === 'transfer') what = `перевод ${payerName(o.from).toLowerCase()} → ${payerTo(o.to)} на ${rub(o.amount)} (${dmy(o.date)})`;
  else if (h.entity === 'category') what = `категорию «${esc(o.name)}»${h.action === 'update' && b && a && b.partsJson !== a.partsJson ? ': новое правило распределения' : ''}`;
  else if (h.entity === 'member') what = `участника «${esc(o.name)}»`;

  return `<div class="h"><div>${who} ${verb} ${what}</div><div class="when">${new Date(h.at).toLocaleString('ru-RU')}</div></div>`;
}

let F = null;
function partsState(list) {
  const st = {};
  activeMembers().forEach(m => st[m.id] = { on: false, bp: '', kop: '', resp: m.id === 'L' ? 'L' : 'M' });
  (list || []).forEach(p => {
    if (!st[p.m]) st[p.m] = { on: false, bp: '', kop: '', resp: p.m === 'L' ? 'L' : 'M' };
    st[p.m] = { on: true, bp: p.bp ? String(p.bp / 100).replace('.', ',') : '', kop: p.kop ? kopInput(p.kop) : '', resp: p.resp || (p.m === 'L' ? 'L' : 'M') };
  });
  return st;
}

function formToEngine() {
  const a = parseRub(F.amount);
  if (isNaN(a) || a === 0) throw new Error('Введите сумму');
  const amount = F.refund ? -a : a;
  if (F.mode === 'personal') return { amount, mode: 'equal', parts: [{ m: F.owner, resp: F.owner }] };
  const parts = distMembers().filter(m => F.parts[m.id].on).map(m => {
    const p = F.parts[m.id], o = { m: m.id, resp: p.resp };
    if (F.mode === 'percent') o.bp = Math.round((parseFloat(String(p.bp).replace(',', '.')) || 0) * 100);
    if (F.mode === 'fixed') { const k = parseRub(p.kop); o.kop = isNaN(k) ? NaN : (F.refund ? -k : k); }
    return o;
  });
  return { amount, mode: F.mode, parts };
}

  const bal = monthStats(S.ym).s.balance;
  T = { id: t ? t.id : null, version: t ? t.version : null, requestId: uid(), date: t ? t.date : (inYm(todayIso(), S.ym) ? todayIso() : ymKey(S.ym) + '-28'),
    amount: t ? kopInput(t.amount) : (bal ? kopInput(roundRub_(Math.abs(bal))) : ''), from: t ? t.from : (bal < 0 ? 'M' : 'L'), comment: t ? t.comment : '' };
  openSheet(`${head(t ? 'Изменить перевод' : 'Новый перевод')}
    <div class="field"><span class="lab">Кто кому перевёл</span><div class="seg" id="t-dir"></div></div>
    <div class="row2"><div class="field"><label for="t-amount">Сумма, ₽</label><input class="inp amount num" id="t-amount" data-autofocus inputmode="decimal" value="${esc(T.amount)}" autocomplete="off"></div>
    <div class="field"><label for="t-date">Дата</label><input class="inp" type="date" id="t-date" value="${T.date}"></div></div>
    <div class="field"><label for="t-comment">Комментарий, по желанию</label><input class="inp" id="t-comment" maxlength="500" value="${esc(T.comment)}" placeholder="Например, за октябрь"></div>
    <div id="t-prev"></div><div id="t-msg"></div>
    <button class="save" id="t-save">${t ? 'Сохранить изменения' : 'Записать перевод'}</button>
    ${t ? `<div class="actions"><button class="btn ghost" data-tdel="${t.id}">Удалить перевод</button><button class="btn ghost" data-xhist="${t.id}">История</button></div><div id="d-extra"></div>` : ''}`, 'Перевод');
  drawTransfer();
}
function drawTransfer() {
  sheetEl.querySelector('#t-dir').innerHTML = [['L', 'Лаура → маме'], ['M', 'Мама → Лауре']].map(([p, l]) => `<button data-tfrom="${p}" aria-pressed="${T.from === p}">${l}</button>`).join('');
  const k = parseRub(T.amount), ym = ymOf(T.date || todayIso());
  const base = exps().filter(e => inYm(e.date, ym)), tr = trs().filter(t => inYm(t.date, ym) && t.id !== T.id);
  const before = settle_(base, tr).balance;
  const after = isNaN(k) ? before : before + (T.from === 'L' ? -k : k);
  sheetEl.querySelector('#t-prev').innerHTML = `<div class="box"><div class="label">Взаиморасчёт за ${MONTHS[ym.m].toLowerCase()}</div><div class="num">${debtShort(before)} → <b>${debtShort(after)}</b></div>
    ${!isNaN(k) && Math.sign(after) !== Math.sign(before) && after !== 0 && before !== 0 ? '<div class="hint">Перевод больше долга: направление долга поменяется.</div>' : ''}</div>`;
}
async function saveTransfer(btn) {
  T.amount = sheetEl.querySelector('#t-amount').value; T.date = sheetEl.querySelector('#t-date').value; T.comment = sheetEl.querySelector('#t-comment').value;
  const msg = sheetEl.querySelector('#t-msg'), k = parseRub(T.amount);
  if (isNaN(k) || k <= 0) { msg.innerHTML = '<div class="err">Введите сумму перевода</div>'; return; }
  if (!T.date) { msg.innerHTML = '<div class="err">Укажите дату</div>'; return; }
  try {
    const wasEdit = !!T.id;
    const res = await run(btn, () => api('api_saveTransfer', { id: T.id, version: T.version, requestId: T.requestId, date: T.date, amount: k, from: T.from, to: T.from === 'L' ? 'M' : 'L', comment: T.comment.trim() }));
    closeSheet(); setData(res.data); toast(wasEdit ? 'Перевод изменён' : 'Перевод записан');
  } catch (e) { msg.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
function askDeleteTransfer(id) {
  sheetEl.querySelector('#d-extra').innerHTML = `<div class="warnbox"><span>Удалить перевод? Долг снова увеличится на его сумму.</span><div class="actions"><button class="btn small danger" data-tdelok="${id}">Удалить</button><button class="btn small ghost" data-xdelno>Отмена</button></div></div>`;
}
async function deleteTransfer(id, btn) {
  const t = S.d.transfers.find(x => x.id === id);
  try {
    const res = await run(btn, () => api('api_deleteTransfer', id, t.version));
    closeSheet(); setData(res.data);
    toast('Перевод удалён', { label: 'Вернуть', fn: async () => { try { setData((await api('api_restoreTransfer', id)).data); } catch (er) { toast(er.message); } } });
  } catch (er) { sheetEl.querySelector('#d-extra').innerHTML = `<div class="err">${esc(er.message)}</div>`; }
}

/* ---------- Категория ---------- */
let C = null;
function openCategoryForm(id) {
  const c = id ? catById(id) : null;
  C = { id: c ? c.id : null, version: c ? c.version : null, name: c ? c.name : '', color: c ? c.color : PALETTE.find(p => !S.d.categories.some(x => x.color === p)) || PALETTE[0],
    mode: c ? c.mode : 'equal', flexible: c ? c.flexible : false, parts: partsState(c ? JSON.parse(c.partsJson || '[]') : [{ m: 'L', resp: 'L' }, { m: 'M', resp: 'M' }]), archived: c ? c.archived : false };
  const used = c ? exps().filter(e => e.categoryId === c.id).length : 0;
  openSheet(`${head(c ? 'Категория' : 'Новая категория')}
    <div class="field"><label for="c-name">Название</label><input class="inp" id="c-name" data-autofocus maxlength="60" value="${esc(C.name)}" placeholder="Например, Подарки"></div>
    <div class="field"><span class="lab">Цвет</span><div class="swatches" id="c-colors"></div></div>
    <div id="c-rule" class="field"></div>
    <div class="note">Новое правило применится только к новым расходам. Уже внесённые операции сохранят своё распределение.</div>
    <div id="c-msg"></div>
    <button class="save" id="c-save">${c ? 'Сохранить категорию' : 'Создать категорию'}</button>
    ${c ? `<div class="actions"><button class="btn ghost" data-carch="${c.archived ? '0' : '1'}">${c.archived ? 'Вернуть из архива' : 'В архив'}</button>${used ? '' : '<button class="btn ghost" data-cdel>Удалить</button>'}</div>
      <div class="hint">${used ? `В категории ${used} ${plural(used, 'операция', 'операции', 'операций')}, поэтому её можно только отправить в архив: история сохранится.` : 'В категории нет операций, её можно удалить.'}</div><div id="d-extra"></div>` : ''}`, 'Категория');
  drawCategory();
}
function drawCategory() {
  sheetEl.querySelector('#c-colors').innerHTML = PALETTE.map(p => `<button class="sw" data-ccolor="${p}" aria-pressed="${C.color.toUpperCase() === p}" style="background:${p}" aria-label="Цвет ${p}"></button>`).join('') +
    `<input type="color" id="c-custom" value="${esc(C.color)}" aria-label="Свой цвет">`;
  const ms = S.d.members.filter(m => !m.archived || C.parts[m.id] && C.parts[m.id].on);
  let check = '';
  const on = ms.filter(m => C.parts[m.id] && C.parts[m.id].on);
  if (C.mode === 'percent') { const t = on.reduce((a, m) => a + (parseFloat(String(C.parts[m.id].bp).replace(',', '.')) || 0), 0); check = `Распределено ${String(Math.round(t * 100) / 100).replace('.', ',')}% из 100%`; }
  sheetEl.querySelector('#c-rule').innerHTML = `<span class="lab">Как делить расходы</span>
    <div class="seg">${[['equal', 'Поровну'], ['percent', 'Проценты'], ['fixed', 'Суммы'], ['personal', 'Личная']].map(([k, l]) => `<button data-cmode="${k}" aria-pressed="${C.mode === k}">${l}</button>`).join('')}</div>
    ${C.mode === 'personal' ? '<span class="hint">В каждой покупке выбирается, чья она: Лауры или мамы. Покупка целиком относится на этого человека.</span>' : `
    ${C.mode === 'equal' ? `<label class="check"><input type="checkbox" id="c-flex" ${C.flexible ? 'checked' : ''}> Гибкая: количество человек выбирается в каждой операции</label>` : ''}
    ${C.mode === 'fixed' ? '<span class="hint">Фиксированные суммы подставятся в расход. Если сумма расхода другая, доли нужно будет поправить в самой операции.</span>' : ''}
    ${ms.map(m => { const p = C.parts[m.id]; return `<div class="prow"><label><input type="checkbox" data-con="${m.id}" ${p.on ? 'checked' : ''}> ${esc(m.name)}</label>
      ${C.mode === 'equal' ? '<span></span>' : `<input class="inp num" data-cval="${m.id}" inputmode="decimal" placeholder="${C.mode === 'percent' ? '%' : '₽'}" value="${esc(C.mode === 'percent' ? p.bp : p.kop)}" ${p.on ? '' : 'disabled'}>`}
      <select class="inp" data-cresp="${m.id}" ${p.on ? '' : 'disabled'}><option value="L" ${p.resp === 'L' ? 'selected' : ''}>платит Лаура</option><option value="M" ${p.resp === 'M' ? 'selected' : ''}>платит мама</option></select></div>`; }).join('')}
    ${check ? `<span class="hint">${check}</span>` : ''}`}`;
}
function syncCategory() {
  C.name = sheetEl.querySelector('#c-name').value;
  const flex = sheetEl.querySelector('#c-flex'); if (flex) C.flexible = flex.checked;
  sheetEl.querySelectorAll('[data-cval]').forEach(i => { const p = C.parts[i.dataset.cval]; if (C.mode === 'percent') p.bp = i.value; else p.kop = i.value; });
  sheetEl.querySelectorAll('[data-cresp]').forEach(i => C.parts[i.dataset.cresp].resp = i.value);
}
async function saveCategory(btn) {
  syncCategory();
  const msg = sheetEl.querySelector('#c-msg');
  const parts = C.mode === 'personal' ? [] : Object.keys(C.parts).filter(k => C.parts[k].on).map(k => {
    const p = C.parts[k], o = { m: k, resp: p.resp };
    if (C.mode === 'percent') o.bp = Math.round((parseFloat(String(p.bp).replace(',', '.')) || 0) * 100);
    if (C.mode === 'fixed') o.kop = parseRub(p.kop) || 0;
    return o;
  });
  try {
    const res = await run(btn, () => api('api_saveCategory', { id: C.id, version: C.version, name: C.name, color: C.color, mode: C.mode, flexible: C.flexible, parts }));
    closeSheet(); setData(res.data); toast('Категория сохранена');
  } catch (e) { msg.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

/* ---------- Участник ---------- */
function openMemberForm(id) {
  const m = id ? member(id) : null;
  openSheet(`${head(m ? 'Участник' : 'Новый участник')}
    <div class="field"><label for="m-name">Имя</label><input class="inp" id="m-name" data-autofocus maxlength="40" value="${esc(m ? m.name : '')}"></div>
    ${m ? `<label class="check"><input type="checkbox" id="m-arch" ${m.archived ? 'checked' : ''}> В архиве: не предлагать в новых расходах</label>` : ''}
    <div class="note">Член семьи не платит сам: его доли по умолчанию оплачивает мама. Это можно изменить в правиле категории или в конкретной операции.</div>
    <div id="m-msg"></div><button class="save" id="m-save" data-mid="${m ? m.id : ''}">Сохранить</button>`, 'Участник');
}
async function saveMember(btn) {
  const id = btn.dataset.mid, arch = sheetEl.querySelector('#m-arch');
  try {
    const res = await run(btn, () => api('api_saveMember', { id: id || null, name: sheetEl.querySelector('#m-name').value, archived: arch ? arch.checked : undefined }));
    closeSheet(); setData(res.data); toast('Сохранено');
  } catch (e) { sheetEl.querySelector('#m-msg').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

/* ================= События ================= */
document.addEventListener('click', async ev => {
  const t = ev.target;
  if (t.matches('[data-scrim]') || t.closest('[data-close]')) return closeSheet();
  const q = s => t.closest(s);
  let el;
  if ((el = q('[data-go]'))) { S.view = el.dataset.go; closeSheet(); render(); window.scrollTo(0, 0); return; }
  if ((el = q('[data-act]'))) {
    const a = el.dataset.act;
    if (a === 'add-expense') return openExpenseForm();
    if (a === 'add-transfer') return openTransferForm();
    if (a === 'add-category') return openCategoryForm();
    if (a === 'add-member') return openMemberForm();
    if (a === 'prev-month') { S.ym = prevYm(S.ym); return render(); }
    if (a === 'next-month') { S.ym = nextYm(S.ym); return render(); }
    if (a === 'prev-year') { S.year--; return render(); }
    if (a === 'next-year') { S.year++; return render(); }
    if (a === 'reload') return reload(true);
    if (a === 'more') return openSheet(`${head('Ещё')}<div class="list">${[['categories', 'Категории'], ['settings', 'Настройки']].map(([k, l]) => `<div class="row"><button class="link" style="font-size:16px" data-go="${k}">${l}</button></div>`).join('')}</div>`, 'Меню');
    if (a === 'load-history') { const box = document.getElementById('hist'); box.innerHTML = '<div class="hint">Загружаем…</div>'; try { const h = await api('api_history', '', 60); box.innerHTML = `<div class="hist">${h.map(histLine).join('') || '<div class="hint">Изменений пока нет</div>'}</div>`; } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; } return; }
    if (a === 'backup') { const box = document.getElementById('backup-res'); el.disabled = true; el.textContent = 'Создаём копию…'; try { const r = await api('api_backupNow'); setData(r.data); toast('Копия создана'); } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; el.disabled = false; el.textContent = 'Создать копию сейчас'; } return; }
  }
  if ((el = q('[data-export]'))) {
    const box = document.getElementById('export-res'); box.innerHTML = '<div class="hint">Готовим файл, это занимает до 20 секунд…</div>';
    try { const r = await api('api_exportXlsx', el.dataset.export); box.innerHTML = `<div>Готово: <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.name)}</a></div>`; }
    catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    return;
  }
  if ((el = q('[data-scope]'))) { S.scope = el.dataset.scope; return render(); }
  if ((el = q('[data-goto-month]'))) { S.ym = ymOf(el.dataset.gotoMonth + '-01'); S.scope = 'month'; return render(); }
  if ((el = q('[data-open-exp]'))) return openExpenseDetails(el.dataset.openExp);
  if ((el = q('[data-open-tr]'))) return openTransferForm(el.dataset.openTr);
  if ((el = q('[data-open-cat]'))) return openCategoryForm(el.dataset.openCat);
  if ((el = q('[data-open-member]'))) return openMemberForm(el.dataset.openMember);
  if (!sheetEl) return;
  // Форма расхода
  if ((el = q('[data-xcat]'))) { syncExpenseFields(); applyCategory(catById(el.dataset.xcat)); drawExpenseStatic(); drawDist(); return drawPreview(); }
  if ((el = q('[data-xpaid]'))) { syncExpenseFields(); F.paidBy = el.dataset.xpaid; drawExpenseStatic(); return drawPreview(); }
  if ((el = q('[data-xowner]'))) { syncExpenseFields(); F.owner = el.dataset.xowner; drawDist(); return drawPreview(); }
  if ((el = q('[data-xcount]'))) { syncExpenseFields(); const n = +el.dataset.xcount; activeMembers().forEach((m, i) => { if (!F.parts[m.id]) F.parts[m.id] = { on: false, bp: '', kop: '', resp: m.id === 'L' ? 'L' : 'M' }; F.parts[m.id].on = i < n; }); drawDist(); return drawPreview(); }
  if ((el = q('[data-xmode]'))) { syncExpenseFields(); F.mode = el.dataset.xmode; drawDist(); return drawPreview(); }
  if ((el = q('[data-xact]'))) {
    const a = el.dataset.xact;
    if (a === 'force') { F.force = true; return saveExpense(sheetEl.querySelector('#x-save')); }
    syncExpenseFields();
    if (a === 'custom') { F.custom = true; }
    if (a === 'reset') { applyCategory(catById(F.categoryId)); }
    if (a === 'evenly') {
      const on = distMembers().filter(m => F.parts[m.id].on);
      if (F.mode === 'percent') { const v = allocate_(10000, on.map(() => 1)); on.forEach((m, i) => F.parts[m.id].bp = String(v[i] / 100).replace('.', ',')); }
      if (F.mode === 'fixed') { const amt = parseRub(F.amount); if (!isNaN(amt)) { const v = allocate_(amt, on.map(() => 1)); on.forEach((m, i) => F.parts[m.id].kop = kopInput(v[i])); } }
    }
    drawDist(); return drawPreview();
  }
  if ((el = q('#x-save'))) return saveExpense(el);
  if ((el = q('[data-xedit]'))) return openExpenseForm(el.dataset.xedit);
  if ((el = q('[data-xdel]'))) return askDeleteExpense(el.dataset.xdel);
  if ((el = q('[data-xdelok]'))) return deleteExpense(el.dataset.xdelok, el);
  if ((el = q('[data-xdelno]'))) { sheetEl.querySelector('#d-extra').innerHTML = ''; return; }
  if ((el = q('[data-xhist]'))) return showEntityHistory(el.dataset.xhist);
  // Перевод
  if ((el = q('[data-tfrom]'))) { T.amount = sheetEl.querySelector('#t-amount').value; T.date = sheetEl.querySelector('#t-date').value; T.from = el.dataset.tfrom; return drawTransfer(); }
  if ((el = q('#t-save'))) return saveTransfer(el);
  if ((el = q('[data-tdel]'))) return askDeleteTransfer(el.dataset.tdel);
  if ((el = q('[data-tdelok]'))) return deleteTransfer(el.dataset.tdelok, el);
  // Категория
  if ((el = q('[data-ccolor]'))) { syncCategory(); C.color = el.dataset.ccolor; return drawCategory(); }
  if ((el = q('[data-cmode]'))) { syncCategory(); C.mode = el.dataset.cmode; if (C.mode !== 'equal') C.flexible = false; return drawCategory(); }
  if ((el = q('#c-save'))) return saveCategory(el);
  if ((el = q('[data-carch]'))) { try { const r = await run(el, () => api('api_archiveCategory', C.id, el.dataset.carch === '1')); closeSheet(); setData(r.data); toast(el.dataset.carch === '1' ? 'Категория в архиве' : 'Категория возвращена'); } catch (e) { sheetEl.querySelector('#c-msg').innerHTML = `<div class="err">${esc(e.message)}</div>`; } return; }
  if ((el = q('[data-cdel]'))) { sheetEl.querySelector('#d-extra').innerHTML = `<div class="warnbox"><span>Удалить категорию «${esc(C.name)}» насовсем?</span><div class="actions"><button class="btn small danger" data-cdelok>Удалить</button><button class="btn small ghost" data-xdelno>Отмена</button></div></div>`; return; }
  if ((el = q('[data-cdelok]'))) { try { const r = await run(el, () => api('api_deleteCategory', C.id)); closeSheet(); setData(r.data); toast('Категория удалена'); } catch (e) { sheetEl.querySelector('#d-extra').innerHTML = `<div class="err">${esc(e.message)}</div>`; } return; }
  if ((el = q('#m-save'))) return saveMember(el);
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (sheetEl && sheetEl.contains(t)) {
    if (sheetEl.querySelector('#x-amount')) {
      syncExpenseFields();
      if (t.dataset.xon) { F.parts[t.dataset.xon].on = t.checked; drawDist(); }
      else if (t.dataset.xval || t.id === 'x-amount') { const c = sheetEl.querySelector('#x-check'); if (c) { drawDist(); const n = sheetEl.querySelector(t.dataset.xval ? `[data-xval="${t.dataset.xval}"]` : '#x-amount'); if (n && n !== t) { n.focus(); const v = n.value.length; try { n.setSelectionRange(v, v); } catch (e) {} } } }
      return drawPreview();
    }
    if (sheetEl.querySelector('#t-amount')) { T.amount = sheetEl.querySelector('#t-amount').value; T.date = sheetEl.querySelector('#t-date').value; return drawTransfer(); }
    if (sheetEl.querySelector('#c-name')) {
      syncCategory();
      if (t.dataset.con) { C.parts[t.dataset.con].on = t.checked; drawCategory(); }
      else if (t.id === 'c-custom') { C.color = t.value.toUpperCase(); }
      else if (t.dataset.cval && C.mode === 'percent') { drawCategory(); const n = sheetEl.querySelector(`[data-cval="${t.dataset.cval}"]`); n.focus(); const v = n.value.length; try { n.setSelectionRange(v, v); } catch (e) {} }
    }
    return;
  }
  const map = { 'f-month': 'month', 'f-cat': 'cat', 'f-payer': 'payer', 'f-sort': 'sort', 'f-min': 'min', 'f-max': 'max', 'f-q': 'q' };
  if (map[t.id]) { S.f[map[t.id]] = t.value; const box = document.getElementById('exp-list'); if (box) box.innerHTML = expenseList(); }
});
document.addEventListener('change', ev => { if (['f-month', 'f-cat', 'f-payer', 'f-sort'].includes(ev.target.id)) ev.target.dispatchEvent(new Event('input', { bubbles: true })); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && sheetEl) closeSheet(); });

/* ================= Отрисовка и синхронизация ================= */
let resizeT;
window.addEventListener('resize', () => { if (S.view !== 'analytics') return; clearTimeout(resizeT); resizeT = setTimeout(render, 200); });
function render() {
  if (!S.d) return;
  renderNav();
  const v = { overview: viewOverview, expenses: viewExpenses, settle: viewSettle, analytics: viewAnalytics, categories: viewCategories, settings: viewSettings }[S.view];
  document.getElementById('view').innerHTML = v();
}
async function reload(quiet) {
  try { setData(await api('api_bootstrap')); if (quiet) toast('Данные обновлены'); }
  catch (e) { toast(e.message); }
}
async function checkUpdates() {
  if (!S.d || !TOKEN || document.hidden) return;
  try {
    const rev = await api('api_rev');
    if (rev !== S.d.rev) {
      if (sheetEl) { S.newData = true; onSheetClose = () => reload(true); }
      else reload(true);
    }
  } catch (e) { /* сеть пропала — попробуем в следующий раз */ }
}
setInterval(checkUpdates, 25000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdates(); });
function start() {
  document.getElementById('view').innerHTML = '<div class="loading">Загружаем данные…</div>';
  api('api_bootstrap').then(setData).catch(e => {
    if (!TOKEN) return;
    document.getElementById('view').innerHTML = `<div class="loading"><div><h2 style="font-family:var(--display);color:var(--fg)">Не удалось открыть бюджет</h2><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Попробовать снова</button></div></div>`;
  });
}
if (TOKEN) start(); else showLogin();
</script>
</body>
</html>
